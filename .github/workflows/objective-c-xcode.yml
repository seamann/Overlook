name: Xcode - Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Overlook (macOS)
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM + DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Overlook.xcodeproj \
            -scheme Overlook \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Check native WebRTC import guard
        if: matrix.configuration == 'Debug'
        run: |
          set -euo pipefail
          bash tests/WebRTCImportGuardTests.sh "$GITHUB_WORKSPACE/.build/SourcePackages/artifacts/webrtc/WebRTC/WebRTC.xcframework/macos-x86_64_arm64"

      - name: Run policy and native WebRTC compatibility tests
        if: matrix.configuration == 'Debug'
        run: |
          set -euo pipefail
          scripts/test-agent-control.sh swift

      - name: Test Overlook MCP
        if: matrix.configuration == 'Debug'
        working-directory: mcp/overlook-control
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Build (${{ matrix.configuration }})
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Overlook.xcodeproj \
            -scheme Overlook \
            -configuration "${{ matrix.configuration }}" \
            -sdk macosx \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
